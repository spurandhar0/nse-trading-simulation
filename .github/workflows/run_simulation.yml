name: Monthly Parameter Sweep (All 2000 Combos)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: >
          Symbols to test — comma-separated (e.g. TCS,WIPRO,INFY).
          Leave blank to use watch_symbols from config (or ALL if config is also blank).
        required: false
        default: ''
        type: string
      run_consolidate_csv:
        description: 'Step 1 – Consolidate bhav CSVs to DB (skip if db/ already built)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_filter_eq:
        description: 'Step 2 – Filter EQ series (skip if eq_data already built)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_ath:
        description: 'Step 3 – Compute All Time High per symbol'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_signals:
        description: 'Step 4 – Filter trading signals (all filter param combos)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_simulation:
        description: 'Step 5 – Run full 2000-combo parameter sweep → Excel'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_consolidate_results:
        description: 'Step 6 – Merge all result Excels into one consolidated file'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore db/ cache
        id: db-cache
        uses: actions/cache@v4
        with:
          path: db/
          key: db-${{ runner.os }}-${{ hashFiles('bhav_data/**') }}
          restore-keys: |
            db-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pyarrow openpyxl

      - name: Step 1 – Consolidate CSVs
        if: >-
          ${{
            github.event.inputs.run_consolidate_csv == 'true' ||
            steps.db-cache.outputs.cache-hit != 'true'
          }}
        run: python src/01_consolidate_csv.py

      - name: Step 2 – Filter EQ Series
        if: >-
          ${{
            github.event.inputs.run_filter_eq == 'true' ||
            steps.db-cache.outputs.cache-hit != 'true'
          }}
        run: python src/02_filter_eq.py

      - name: Step 3 – Compute ATH
        if: >-
          ${{
            github.event.inputs.run_ath == 'true' ||
            steps.db-cache.outputs.cache-hit != 'true'
          }}
        run: python src/03_find_ath.py

      # CRITICAL FIX: Step 4 now also runs on cache miss.
      # Previously: only ran when user explicitly said run_signals=true.
      # Bug: cache miss rebuilds steps 1-3 but leaves db/signals.parquet
      # missing → step 5 crashes with "❌ Missing: db/signals.parquet".
      # Fix: run step 4 whenever cache is not a hit (same logic as steps 1-3).
      - name: Step 4 – Filter Signals (all param combos)
        if: >-
          ${{
            github.event.inputs.run_signals == 'true' ||
            steps.db-cache.outputs.cache-hit != 'true'
          }}
        run: python src/04_filter_signals.py --mode full --symbols "${{ github.event.inputs.symbols }}"

      - name: Step 5 – Run Full Parameter Sweep
        if: ${{ github.event.inputs.run_simulation == 'true' }}
        run: python src/05_run_simulation.py --mode full --symbols "${{ github.event.inputs.symbols }}"

      # FIX (partial output): Always generate a fresh partial Excel from the
      # checkpoint CSV before committing — even if Step 5 was killed by the
      # 350-min timeout. The simulation flushes the checkpoint CSV every 5 combos,
      # so this step ensures a visible Excel is always present in the repo.
      - name: Generate partial Excel from checkpoint
        if: always()
        run: |
          if [ -f "output/partial/full_sweep_partial.csv" ]; then
            echo "Checkpoint CSV found — generating partial Excel..."
            python src/05_run_simulation.py --generate-partial-excel
          else
            echo "No checkpoint CSV — skipping partial Excel generation."
          fi

      - name: Step 6 – Consolidate Result Files
        if: ${{ github.event.inputs.run_consolidate_results == 'true' }}
        run: python src/06_consolidate_results.py

      - name: Commit outputs to repo
        if: ${{ always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/ output/
          git diff --cached --quiet || git commit -m "param-sweep: $(date +'%d-%b-%Y %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || (sleep 5 && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}")

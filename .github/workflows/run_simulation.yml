name: Monthly Parameter Sweep (All 2000 Combos)

# ─── When to run ──────────────────────────────────────────────────────────────
# Manual only — run this once a month to find best parameters
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: >
          Symbols to test — comma-separated (e.g. TCS,WIPRO,INFY).
          Leave blank to use watch_symbols from config (or ALL if config is also blank).
        required: false
        default: ''
        type: string
      run_consolidate_csv:
        description: 'Step 1 – Consolidate bhav CSVs to DB (skip if db/ already built)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_filter_eq:
        description: 'Step 2 – Filter EQ series (skip if eq_data already built)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_ath:
        description: 'Step 3 – Compute All Time High per symbol'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_signals:
        description: 'Step 4 – Filter trading signals (all filter param combos)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_simulation:
        description: 'Step 5 – Run full 2000-combo parameter sweep → Excel'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_consolidate_results:
        description: 'Step 6 – Merge all result Excels into one consolidated file'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 300    # 5 hours max
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Cache db/ parquet files between runs ────────────────────────────────
      # If step toggles are set to 'false', the cached parquets are used instead.
      # Cache miss forces rebuild even if toggle is 'false'.
      - name: Restore db/ cache
        id: db-cache
        uses: actions/cache@v4
        with:
          path: db/
          key: db-${{ runner.os }}-${{ hashFiles('bhav_data/**') }}
          restore-keys: |
            db-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pyarrow openpyxl

      # ── Step 1: Consolidate CSVs ─────────────────────────────────────────────
      - name: Step 1 – Consolidate CSVs
        if: >-
          ${{
            github.event.inputs.run_consolidate_csv == 'true' ||
            steps.db-cache.outputs.cache-hit != 'true'
          }}
        run: python src/01_consolidate_csv.py

      # ── Step 2: Filter EQ ────────────────────────────────────────────────────
      - name: Step 2 – Filter EQ Series
        if: >-
          ${{
            github.event.inputs.run_filter_eq == 'true' ||
            steps.db-cache.outputs.cache-hit != 'true'
          }}
        run: python src/02_filter_eq.py

      # ── Step 3: ATH ──────────────────────────────────────────────────────────
      - name: Step 3 – Compute ATH
        if: >-
          ${{
            github.event.inputs.run_ath == 'true' ||
            steps.db-cache.outputs.cache-hit != 'true'
          }}
        run: python src/03_find_ath.py

      # ── Step 4: Filter Signals (full mode — all filter param combos) ─────────
      - name: Step 4 – Filter Signals (all param combos)
        if: ${{ github.event.inputs.run_signals == 'true' }}
        run: python src/04_filter_signals.py --mode full --symbols "${{ github.event.inputs.symbols }}"

      # ── Step 5: Run Simulation (full mode — all 2000 trade combos) ───────────
      - name: Step 5 – Run Full Parameter Sweep
        if: ${{ github.event.inputs.run_simulation == 'true' }}
        run: python src/05_run_simulation.py --mode full --symbols "${{ github.event.inputs.symbols }}"

      # ── Step 6: Consolidate Results ──────────────────────────────────────────
      - name: Step 6 – Consolidate Result Files
        if: ${{ github.event.inputs.run_consolidate_results == 'true' }}
        run: python src/06_consolidate_results.py

      # ── Commit all outputs ────────────────────────────────────────────────────
      - name: Commit outputs to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/ output/
          git diff --cached --quiet || git commit -m "param-sweep: $(date +'%d-%b-%Y %H:%M')"
          git push

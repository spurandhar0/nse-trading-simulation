name: Monthly Parameter Sweep

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: >
          Symbols to test — comma-separated (e.g. TCS,WIPRO,INFY).
          Leave blank to use watch_symbols from config (or ALL if config is also blank).
        required: false
        default: ''
        type: string
      run_consolidate_csv:
        description: 'Step 1 – Consolidate bhav CSVs to DB (skip if db/ already built)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_filter_eq:
        description: 'Step 2 – Filter EQ series (skip if eq_data already built)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_ath:
        description: 'Step 3 – Compute All Time High per symbol'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_signals:
        description: 'Step 4 – Filter trading signals (all filter param combos)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_simulation:
        description: 'Step 5 – Run full parameter sweep → chunked CSV + Excel'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_consolidate_results:
        description: 'Step 6 – Merge all result Excels into one consolidated file'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

concurrency:
  group: parameter-sweep
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Fix: Node.js 24 upgrade (deadline Jun 2 2026)

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0         # FIX: full history so rebase never fails on shallow clone

      - name: Configure git early (needed for background committer)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Background committer: saves partial output every 10 min throughout ALL steps.
      # Commits all chunk files in output/partial/ — each chunk is ≤100K rows (~22 MB)
      # so no single file ever hits GitHub's 100 MB hard limit.
      - name: Start background checkpoint committer
        run: |
          nohup bash -c '
            while true; do
              sleep 600
              git add output/ db/ 2>/dev/null || true
              if ! git diff --cached --quiet 2>/dev/null; then
                git commit -m "auto-checkpoint: $(date +%H:%M UTC)" 2>/dev/null || true
                git fetch origin main 2>/dev/null || true
                git rebase origin/main 2>/dev/null || git rebase --abort 2>/dev/null || true
                git push origin HEAD:main 2>/dev/null && echo "[bg] pushed at $(date +%H:%M)" || echo "[bg] push failed at $(date +%H:%M)"
              else
                echo "[bg] nothing new at $(date +%H:%M)"
              fi
            done
          ' >> /tmp/bg_commit.log 2>&1 &
          echo $! > /tmp/bg_commit.pid
          echo "Background committer started (PID: $!) — fires every 10 min"

      - name: Restore db/ cache
        id: db-cache
        uses: actions/cache@v4
        with:
          path: db/
          key: db-${{ runner.os }}-${{ hashFiles('bhav_data/**') }}
          restore-keys: |
            db-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pyarrow openpyxl

      - name: Step 1 – Consolidate CSVs
        if: >-
          ${{
            github.event.inputs.run_consolidate_csv == 'true' ||
            steps.db-cache.outputs.cache-hit != 'true'
          }}
        run: python src/01_consolidate_csv.py

      - name: Step 2 – Filter EQ Series
        if: >-
          ${{
            github.event.inputs.run_filter_eq == 'true' ||
            steps.db-cache.outputs.cache-hit != 'true'
          }}
        run: python src/02_filter_eq.py

      - name: Step 3 – Compute ATH
        if: >-
          ${{
            github.event.inputs.run_ath == 'true' ||
            steps.db-cache.outputs.cache-hit != 'true'
          }}
        run: python src/03_find_ath.py

      - name: Step 4 – Filter Signals (all param combos)
        if: >-
          ${{
            github.event.inputs.run_signals == 'true' ||
            steps.db-cache.outputs.cache-hit != 'true'
          }}
        run: python src/04_filter_signals.py --mode full --symbols "${{ github.event.inputs.symbols }}"

      # Compact all chunk files before simulation starts — removes duplicate rows
      # caused by append-mode writes across multiple resume runs.
      - name: Compact partial chunk files (remove duplicates)
        if: ${{ github.event.inputs.run_simulation == 'true' }}
        run: python src/compact_checkpoint.py

      - name: Step 5 – Run Full Parameter Sweep
        if: ${{ github.event.inputs.run_simulation == 'true' }}
        run: python src/05_run_simulation.py --mode full --symbols "${{ github.event.inputs.symbols }}"

      - name: Stop background committer
        if: always()
        run: |
          if [ -f /tmp/bg_commit.pid ]; then
            kill "$(cat /tmp/bg_commit.pid)" 2>/dev/null || true
            echo "Background committer stopped"
          fi
          echo "--- Background commit log ---"
          cat /tmp/bg_commit.log 2>/dev/null || echo "(no log)"

      # Generate partial Excel from chunk files before committing.
      - name: Generate partial Excel from chunk files
        if: always()
        run: |
          CHUNKS=$(ls output/partial/chunk_*.csv 2>/dev/null | wc -l)
          if [ "$CHUNKS" -gt "0" ]; then
            echo "Found $CHUNKS chunk file(s) — generating partial Excel..."
            python src/05_run_simulation.py --generate-partial-excel
          else
            echo "No chunk files — skipping partial Excel generation."
          fi

      - name: Step 6 – Consolidate Result Files
        if: ${{ github.event.inputs.run_consolidate_results == 'true' }}
        run: python src/06_consolidate_results.py

      # FIX (push robustness): fetch + rebase with retry; excludes large XLSX subdirs.
      - name: Commit and push outputs
        if: always()
        run: |
          # Stage chunk files, final Excel, and db/ — force-add full_sweep finals (bypasses gitignore)
          git add "output/partial/" "output/*.csv" "output/*.json" "output/.gitignore" "db/" 2>/dev/null || true
          git add output/.gitkeep 2>/dev/null || true
          git add -f output/full_sweep/full_sweep_final_*.xlsx 2>/dev/null || true
          git add -f output/full_sweep/full_sweep_partial_latest.xlsx 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "param-sweep: $(date +'%d-%b-%Y %H:%M')"
          # Retry push up to 3 times (handles race conditions with bg committer)
          for attempt in 1 2 3; do
            git fetch origin main
            # Stash any unstaged changes before rebase (bg committer may have left some)
            git add -A 2>/dev/null || true
            git diff --cached --quiet 2>/dev/null || git commit -m "auto-checkpoint: pre-rebase $(date +%H:%M)" 2>/dev/null || true
            if git rebase origin/main; then
              git push origin HEAD:main && echo "✅ Push succeeded (attempt $attempt)" && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "⚠️  All push attempts failed — output remains in runner cache only"
          exit 1

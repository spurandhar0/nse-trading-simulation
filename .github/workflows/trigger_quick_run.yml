name: Trigger Quick Run After Bhavcopy

on:
  workflow_run:
    workflows: ["NSE Bhavcopy Fetch"]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Fix: Node.js 24 upgrade (deadline Jun 2, 2026)

jobs:
  trigger-quick-run:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: write

    steps:
      - name: Trigger Quick Run workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'quick_run.yml',
              ref: 'main',
            });
            console.log('✅ Quick Run triggered after Bhavcopy fetch.');

name: Quick Run — Daily BTST Signals

on:
  schedule:
    - cron: '15 13 * * 1-5'   # 6:45 PM IST Mon–Fri
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated symbols (blank = all from config)'
        required: false
        default: ''
      rebuild_db:
        description: 'Rebuild DB from bhav CSVs?'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quick-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Cache pip packages ─────────────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-pandas-openpyxl-pyarrow
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install pandas openpyxl pyarrow

      # ── Cache db/ keyed by bhav_data hash ─────────────────────────────────
      - name: Cache db/ parquet files
        id: cache-db
        uses: actions/cache@v4
        with:
          path: db/
          key: db-quick-${{ hashFiles('bhav_data/**') }}
          restore-keys: db-quick-

      # ── FIX W3: Rebuild flag with correct string handling ──────────────────
      - name: Set rebuild flag
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ steps.cache-db.outputs.cache-hit }}" != "true" ]; then
              echo "rebuild=true"  >> $GITHUB_OUTPUT
              echo "ℹ️  Cache miss — rebuilding DB"
            else
              echo "rebuild=false" >> $GITHUB_OUTPUT
              echo "ℹ️  Cache hit — skipping DB rebuild"
            fi
          else
            VAL="${{ github.event.inputs.rebuild_db }}"
            echo "rebuild=${VAL:-false}" >> $GITHUB_OUTPUT
            echo "ℹ️  Manual run — rebuild_db=${VAL:-false}"
          fi

      # ── Steps 1-3: Build DB (only on cache miss or rebuild=true) ──────────
      - name: Step 1 — Consolidate CSVs
        if: steps.flags.outputs.rebuild == 'true' || steps.cache-db.outputs.cache-hit != 'true'
        run: python src/01_consolidate_csv.py

      - name: Step 2 — Filter EQ series
        if: steps.flags.outputs.rebuild == 'true' || steps.cache-db.outputs.cache-hit != 'true'
        run: python src/02_filter_eq.py

      - name: Step 3 — Find ATH
        if: steps.flags.outputs.rebuild == 'true' || steps.cache-db.outputs.cache-hit != 'true'
        run: python src/03_find_ath.py

      # ── FIX W1: Step 4 ALWAYS runs — signals must be fresh every run ───────
      # signals_quick.parquet is NOT in the db/ cache.
      # Without this, Step 5 crashes with: Missing: db/signals_quick.parquet
      - name: Step 4 — Filter Signals (QUICK mode — always fresh)
        run: |
          SYMS="${{ github.event.inputs.symbols || '' }}"
          if [ -n "$SYMS" ]; then
            python src/04_filter_signals.py --mode quick --symbols "$SYMS"
          else
            python src/04_filter_signals.py --mode quick
          fi

      # ── Step 5: Run simulation ────────────────────────────────────────────
      - name: Step 5 — Run Quick Simulation
        id: sim
        run: |
          SYMS="${{ github.event.inputs.symbols || '' }}"
          if [ -n "$SYMS" ]; then
            python src/05_run_simulation.py --mode quick --symbols "$SYMS"
          else
            python src/05_run_simulation.py --mode quick
          fi

      # ── FIX W-NEW: Commit dated output file back to this repo ─────────────
      # This saves QuickRun_Picks_YYYYMMDD_HHMMSS.xlsx to output/YYYY-MM/ in repo.
      # The dated file is your permanent history. latest_quickrun.xlsx is the
      # live dashboard file (deployed to nse-btst-dashboard repo below).
      - name: Commit output to repo
        if: steps.sim.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the dated output file (not latest_quickrun.xlsx — that goes to dashboard repo)
          git add "output/"
          git diff --cached --quiet && echo "No new output to commit" && exit 0

          git commit -m "quick-run: $(date '+%d-%b-%Y %H:%M IST')"
          git push origin main
          echo "✅ Output committed to repo"

      # ── Upload artifact (always — even on failure) ─────────────────────────
      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickrun-output-${{ github.run_number }}
          path: output/

      # ── FIX W2: Deploy dashboard — fail loudly if Excel missing ───────────
      - name: Deploy dashboard to nse-btst-dashboard
        if: steps.sim.outcome == 'success'
        run: |
          # Hard fail if latest_quickrun.xlsx was not produced
          if [ ! -f output/latest_quickrun.xlsx ]; then
            echo "❌ output/latest_quickrun.xlsx not found"
            echo "   Simulation may have produced no signals, or Step 5 failed silently"
            exit 1
          fi

          SIZE=$(du -sh output/latest_quickrun.xlsx | cut -f1)
          echo "✅ latest_quickrun.xlsx found — size: $SIZE"

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/spurandhar0/nse-btst-dashboard.git" \
            /tmp/dashboard-repo

          # Copy dashboard HTML
          cp dashboard/index.html /tmp/dashboard-repo/index.html

          # Copy latest quickrun Excel — this is what the dashboard auto-fetches
          cp output/latest_quickrun.xlsx /tmp/dashboard-repo/latest_quickrun.xlsx
          echo "✅ Copied latest_quickrun.xlsx ($SIZE)"

          # Write metadata (used by dashboard auto-load banner)
          echo "{\"last_run\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\",\"run_number\":${{ github.run_number }},\"size_kb\":\"$SIZE\"}" \
            > /tmp/dashboard-repo/meta.json

          # Commit and push
          cd /tmp/dashboard-repo
          git add .
          git diff --cached --quiet || git commit -m \
            "Deploy dashboard — Run #${{ github.run_number }} $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
          echo "✅ Dashboard deployed → https://spurandhar0.github.io/nse-btst-dashboard/"

name: Quick Run — Daily BTST Signals

on:
  schedule:
    - cron: '15 13 * * 1-5'   # 6:45 PM IST Mon–Fri
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated symbols (blank = all from config)'
        required: false
        default: ''
      rebuild_db:
        description: 'Rebuild DB from bhav CSVs?'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quick-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Cache pip packages ───────────────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-pandas-openpyxl-pyarrow
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install pandas openpyxl pyarrow

      # ── Cache db/ (parquet files) keyed by bhav_data hash ───────────────────
      # FIX W1: Cache key includes signals_quick so it is always consistent.
      # Steps 1-4 run when: (a) cache miss, OR (b) rebuild_db=true manual trigger.
      - name: Cache db/ parquet files
        id: cache-db
        uses: actions/cache@v4
        with:
          path: db/
          key: db-quick-${{ hashFiles('bhav_data/**') }}
          restore-keys: db-quick-

      # ── Determine rebuild flag ───────────────────────────────────────────────
      # FIX W3: String comparison fixed — rebuild=true only when explicitly set
      # or when cache was missed (new bhav data present).
      - name: Set rebuild flag
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled: rebuild only when bhav_data changed (cache miss)
            if [ "${{ steps.cache-db.outputs.cache-hit }}" != "true" ]; then
              echo "rebuild=true" >> $GITHUB_OUTPUT
              echo "ℹ️  Cache miss — bhav_data changed, rebuilding DB"
            else
              echo "rebuild=false" >> $GITHUB_OUTPUT
              echo "ℹ️  Cache hit — DB unchanged, running simulation only"
            fi
          else
            # Manual dispatch: respect the rebuild_db input
            VAL="${{ github.event.inputs.rebuild_db }}"
            echo "rebuild=${VAL:-false}" >> $GITHUB_OUTPUT
            echo "ℹ️  Manual run — rebuild_db=${VAL:-false}"
          fi

      # ── Steps 1-4: Build DB ─────────────────────────────────────────────────
      # FIX W1: Steps 1-3 run on cache miss OR rebuild=true.
      # Step 4 (filter signals) ALWAYS runs — signals_quick.parquet must be fresh
      # every run because signal_end_date could now include today's data.
      - name: Step 1 — Consolidate CSVs
        if: steps.flags.outputs.rebuild == 'true' || steps.cache-db.outputs.cache-hit != 'true'
        run: python src/01_consolidate_csv.py

      - name: Step 2 — Filter EQ series
        if: steps.flags.outputs.rebuild == 'true' || steps.cache-db.outputs.cache-hit != 'true'
        run: python src/02_filter_eq.py

      - name: Step 3 — Find ATH
        if: steps.flags.outputs.rebuild == 'true' || steps.cache-db.outputs.cache-hit != 'true'
        run: python src/03_find_ath.py

      # FIX W1 KEY: Step 4 runs ALWAYS — not tied to cache.
      # signals_quick.parquet must be regenerated every run because today's signals
      # depend on the most recent trading date in eq_data.parquet.
      # Without this, Step 5 crashes with: Missing: db/signals_quick.parquet
      - name: Step 4 — Filter Signals (QUICK mode)
        run: |
          SYMS="${{ github.event.inputs.symbols || '' }}"
          if [ -n "$SYMS" ]; then
            python src/04_filter_signals.py --mode quick --symbols "$SYMS"
          else
            python src/04_filter_signals.py --mode quick
          fi

      # ── Step 5: Run simulation ───────────────────────────────────────────────
      - name: Step 5 — Run Quick Simulation
        id: sim
        run: |
          SYMS="${{ github.event.inputs.symbols || '' }}"
          if [ -n "$SYMS" ]; then
            python src/05_run_simulation.py --mode quick --symbols "$SYMS"
          else
            python src/05_run_simulation.py --mode quick
          fi

      # ── Upload dated output as artifact ─────────────────────────────────────
      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickrun-output-${{ github.run_number }}
          path: output/

      # ── Deploy dashboard to public nse-btst-dashboard repo ──────────────────
      # FIX W2: Verify latest_quickrun.xlsx exists before deploying.
      # If it is missing the step fails loudly instead of silently deploying nothing.
      - name: Deploy dashboard to public GitHub Pages repo
        if: steps.sim.outcome == 'success'
        run: |
          # Fail immediately if latest_quickrun.xlsx was not produced
          if [ ! -f output/latest_quickrun.xlsx ]; then
            echo "❌ output/latest_quickrun.xlsx not found — simulation may have produced no signals"
            exit 1
          fi

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/spurandhar0/nse-btst-dashboard.git" \
            /tmp/dashboard-repo

          # Copy dashboard HTML
          cp dashboard/index.html /tmp/dashboard-repo/index.html

          # Copy latest quickrun Excel
          cp output/latest_quickrun.xlsx /tmp/dashboard-repo/latest_quickrun.xlsx
          echo "✅ Copied latest_quickrun.xlsx ($(du -sh output/latest_quickrun.xlsx | cut -f1))"

          # Write metadata
          echo "{\"last_run\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\",\"run_number\":${{ github.run_number }}}" \
            > /tmp/dashboard-repo/meta.json

          # Commit and push
          cd /tmp/dashboard-repo
          git add .
          git diff --cached --quiet || git commit -m "Deploy dashboard — Run #${{ github.run_number }} $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
          echo "✅ Dashboard deployed → https://spurandhar0.github.io/nse-btst-dashboard/"

name: Quick Run — Daily BTST Signals

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated symbols (blank = all from config)'
        required: false
        default: ''
      rebuild_db:
        description: 'Rebuild DB from bhav CSVs?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

  schedule:                              # ✅ same level as workflow_dispatch
    - cron: '30 13 * * 1-5'             # Mon–Fri 19:00 IST (13:30 UTC)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Fix: Node.js 24 upgrade (deadline Jun 2 2026)

jobs:
  quick-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-pandas-openpyxl-pyarrow
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install pandas openpyxl pyarrow yfinance pytz

      - name: Cache db/ parquet files
        id: cache-db
        uses: actions/cache@v4
        with:
          path: db/
          key: db-quick-${{ hashFiles('bhav_data/**') }}
          restore-keys: db-quick-

      - name: Set rebuild flag
        id: flags
        run: |
          VAL="${{ github.event.inputs.rebuild_db }}"
          if [ "${{ steps.cache-db.outputs.cache-hit }}" != "true" ]; then
            echo "rebuild=true"  >> $GITHUB_OUTPUT
            echo "ℹ️  Cache miss — rebuilding DB"
          else
            echo "rebuild=${VAL:-false}" >> $GITHUB_OUTPUT
            echo "ℹ️  Cache hit — rebuild_db=${VAL:-false}"
          fi

      - name: Step 1 — Consolidate CSVs
        if: steps.flags.outputs.rebuild == 'true'
        run: python src/01_consolidate_csv.py

      - name: Step 2 — Filter EQ series
        if: steps.flags.outputs.rebuild == 'true'
        run: python src/02_filter_eq.py

      - name: Step 3 — Find ATH
        if: steps.flags.outputs.rebuild == 'true'
        run: python src/03_find_ath.py

      - name: Step 4 — Filter Signals (QUICK mode — always fresh)
        run: |
          SYMS="${{ github.event.inputs.symbols || '' }}"
          if [ -n "$SYMS" ]; then
            python src/04_filter_signals.py --mode quick --symbols "$SYMS"
          else
            python src/04_filter_signals.py --mode quick
          fi

      - name: Step 5 — Run Quick Simulation
        id: sim
        run: |
          SYMS="${{ github.event.inputs.symbols || '' }}"
          if [ -n "$SYMS" ]; then
            python src/05_run_simulation.py --mode quick --symbols "$SYMS"
          else
            python src/05_run_simulation.py --mode quick
          fi

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # FIX (push robustness): fetch + rebase with retry to handle concurrent pushes
      # (e.g. bhavcopy workflow pushing bhav_data/ at the same time).
      - name: Commit output to repo
        if: steps.sim.outcome == 'success'
        continue-on-error: true
        run: |
          git add "output/"
          git diff --cached --quiet && echo "No new output to commit" && exit 0

          git commit -m "quick-run: $(date '+%d-%b-%Y %H:%M IST')"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main && echo "✅ Push succeeded (attempt $attempt)" && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Attempt $attempt failed, retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "⚠️ All push attempts failed"
          exit 1

      - name: Upload output artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quickrun-output-${{ github.run_number }}
          path: output/

      - name: Deploy dashboard to nse-btst-dashboard
        if: steps.sim.outcome == 'success'
        run: |
          if [ ! -f output/latest_quickrun.xlsx ]; then
            echo "❌ output/latest_quickrun.xlsx not found"
            exit 1
          fi

          SIZE=$(du -sh output/latest_quickrun.xlsx | cut -f1)
          echo "✅ latest_quickrun.xlsx found — size: $SIZE"

          # Setup SSH deploy key (no PAT needed, no expiry)
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Shallow clone via SSH — no PAT, no expiry
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key" \
            git clone --depth 1 \
            git@github.com:spurandhar0/nse-btst-dashboard.git \
            /tmp/dashboard-repo

          cp output/latest_quickrun.xlsx /tmp/dashboard-repo/latest_quickrun.xlsx
          echo "✅ Copied latest_quickrun.xlsx ($SIZE)"

          touch /tmp/dashboard-repo/.nojekyll

          echo "{\"last_run\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\",\"run_number\":${{ github.run_number }},\"size_kb\":\"$SIZE\"}" \
            > /tmp/dashboard-repo/meta.json

          python src/update_nifty_index.py /tmp/dashboard-repo/nifty_index.json

          cd /tmp/dashboard-repo
          git add .
          git diff --cached --quiet || git commit -m \
            "Deploy dashboard — Run #${{ github.run_number }} $(date -u '+%Y-%m-%d %H:%M UTC')"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key" git push origin main
          echo "✅ Dashboard deployed → https://spurandhar0.github.io/nse-btst-dashboard/"

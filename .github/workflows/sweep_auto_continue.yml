name: Sweep Auto-Continue

on:
  workflow_run:
    workflows: ["Monthly Parameter Sweep (All 2000 Combos)"]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Fix: Node.js 24 upgrade (deadline Jun 2 2026)

jobs:
  check-and-continue:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check if sweep is complete and safe to continue
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            // FIX (cascade protection): If the triggering run lasted < 5 minutes,
            // it was an instant failure / cascade — don't re-trigger endlessly.
            const durationMin = (new Date(run.updated_at) - new Date(run.created_at)) / 60000;
            console.log(`Triggering run #${run.run_number} lasted ${durationMin.toFixed(1)} min (conclusion: ${run.conclusion})`);
            if (durationMin < 5) {
              console.log('Run was too short (<5 min) — looks like an instant failure or cascade. Not re-triggering.');
              core.setOutput('should_continue', 'false');
              return;
            }

            // Check if partial checkpoint CSV exists in the repo
            try {
              const { data: content } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'output/partial/full_sweep_partial.csv',
              });
              // File exists — sweep is NOT complete, trigger another run
              console.log('Partial CSV found — sweep is not complete. Triggering next run...');
              core.setOutput('should_continue', 'true');
            } catch (e) {
              if (e.status === 404) {
                console.log('Partial CSV not found — sweep is complete. No re-trigger needed.');
                core.setOutput('should_continue', 'false');
              } else {
                throw e;
              }
            }

      # FIX: Pass explicit inputs to skip DB rebuild steps (1–4).
      # Only Step 5 (simulation) runs; DB steps are skipped (db/ is cached).
      - name: Trigger next sweep run
        if: steps.check.outputs.should_continue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'run_simulation.yml',
              ref: 'main',
              inputs: {
                run_consolidate_csv:     'false',
                run_filter_eq:           'false',
                run_ath:                 'false',
                run_signals:             'false',
                run_simulation:          'true',
                run_consolidate_results: 'false',
              },
            });
            console.log('✅ Next sweep run triggered (DB rebuild skipped — simulation only).');

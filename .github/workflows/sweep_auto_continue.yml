name: Sweep Auto-Continue

on:
  workflow_run:
    workflows: ["Monthly Parameter Sweep"]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Fix: Node.js 24 upgrade (deadline Jun 2 2026)

jobs:
  check-and-continue:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check if sweep is complete and safe to continue
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            // CASCADE PROTECTION: If the triggering run lasted < 5 minutes,
            // it was an instant failure / cascade — don't re-trigger endlessly.
            const durationMin = (new Date(run.updated_at) - new Date(run.created_at)) / 60000;
            console.log(`Triggering run #${run.run_number} lasted ${durationMin.toFixed(1)} min (conclusion: ${run.conclusion})`);
            if (durationMin < 5) {
              console.log('Run was too short (<5 min) — instant failure or cascade. Not re-triggering.');
              core.setOutput('should_continue', 'false');
              return;
            }

            // Check if any chunk_*.csv files exist in output/partial/
            // (chunk files = sweep is still in progress; no chunk files = complete or not started)
            try {
              const { data: contents } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'output/partial',
              });
              const chunkFiles = Array.isArray(contents)
                ? contents.filter(f => /^chunk_\d+\.csv$/.test(f.name))
                : [];
              if (chunkFiles.length > 0) {
                console.log(`Found ${chunkFiles.length} chunk file(s) — sweep is not complete. Triggering next run...`);
                core.setOutput('should_continue', 'true');
              } else {
                console.log('No chunk files in output/partial/ — sweep is complete or not started. No re-trigger.');
                core.setOutput('should_continue', 'false');
              }
            } catch (e) {
              if (e.status === 404) {
                console.log('output/partial/ directory not found — sweep is complete. No re-trigger needed.');
                core.setOutput('should_continue', 'false');
              } else {
                throw e;
              }
            }

      # Pass explicit inputs to skip DB rebuild steps (1–4).
      # Only Step 5 (simulation) runs on continuation; DB steps are skipped (db/ is cached).
      - name: Trigger next sweep run
        if: steps.check.outputs.should_continue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'run_simulation.yml',
              ref: 'main',
              inputs: {
                run_consolidate_csv:     'false',
                run_filter_eq:           'false',
                run_ath:                 'false',
                run_signals:             'false',
                run_simulation:          'true',
                run_consolidate_results: 'false',
              },
            });
            console.log('✅ Next sweep run triggered (DB rebuild skipped — simulation only).');

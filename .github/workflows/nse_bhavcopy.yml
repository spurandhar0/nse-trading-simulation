name: NSE Bhavcopy Fetch

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 5:00 PM IST (11:30 UTC) Mon-Fri
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Fix: Node.js 24 upgrade (deadline Jun 2 2026)

jobs:
  fetch-bhavcopy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest NSE bhavcopy
        run: python src/01_consolidate_bhavcopy.py

      - name: Filter EQ series
        run: python src/02_filter_eq.py

      - name: Compute ATH signals
        run: python src/03_compute_ath_signals.py

      - name: Generate signals
        run: python src/04_generate_signals.py

      - name: Commit outputs to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f db/ output/ || true
          git diff --cached --quiet || git commit -m "chore: update bhavcopy and signals [skip ci]"
          git push

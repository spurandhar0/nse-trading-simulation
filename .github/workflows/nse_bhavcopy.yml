name: NSE Bhavcopy Fetch

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 5:00 PM IST (11:30 UTC) Mon-Fri
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Fix: Node.js 24 upgrade (deadline Jun 2 2026)

jobs:
  fetch-bhavcopy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest NSE bhavcopy
        run: python src/nse_bhavcopy_fetch.py

      - name: Commit bhav data to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f bhav_data/ || true
          git diff --cached --quiet || git commit -m "auto: NSE bhavcopy $(date +'%d-%b-%Y') [skip ci]"
          git push
